services:
  postgres:
    image: postgres:17-alpine
    container_name: museum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum}
      POSTGRES_DB: ${POSTGRES_DB:-museum}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${POSTGRES_DB:-museum}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
